name: PersonaStudio Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to validate and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.7'
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify tag exists
        run: git rev-parse --verify "refs/tags/$RELEASE_TAG"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run application checks
        run: uv run --no-project --python 3.12 python scripts/check.py
      - name: Verify distributable Python packages
        run: uv run --no-project --python 3.12 python scripts/verify-release.py
      - name: Build release assets
        run: |
          epoch=$(git log -1 --format=%ct "$RELEASE_TAG")
          uv run --no-project --python 3.12 python scripts/build-release.py \
            --dist-dir dist/release \
            --expected-tag "$RELEASE_TAG" \
            --source-date-epoch "$epoch"
      - name: Test one-line installation
        run: uv run --no-project --python 3.12 python scripts/test-installer.py --dist-dir dist/release
      - name: Run browser flows
        run: |
          npm run test:errors
          npm run test:connections
          npm run test:home
          npm run test:ux
          npm run test:reset
          npm run test:browser
          npm run test:first-use
          npm run test:extraction
      - name: Create draft release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "PersonaStudio $RELEASE_TAG" \
            dist/release/install.sh \
            dist/release/personastudio-"$RELEASE_TAG".tar.gz \
            dist/release/release-manifest.json \
            dist/release/SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --latest
